<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Belajar gitar online terstruktur dari fondasi dasar sampai teknik shredding. Video materi bertahap, akses selamanya, belajar sesuai ritme kamu." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gitar Sakti" />
    <meta property="og:title" content="Gitar Sakti — Kursus Gitar Online Terstruktur" />
    <meta property="og:description" content="Belajar gitar online terstruktur dari fondasi dasar sampai teknik shredding. Akses materi selamanya." />
    <link rel="canonical" href="https://gitarsakti.com/" />
    <meta property="og:url" content="https://gitarsakti.com/" />
    <meta property="og:image" content="https://gitarsakti.com/gitar-sakti-bg.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA: supaya website bisa di-"Install" jadi aplikasi khusus halaman Admin -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#B8892E" />
    <link rel="icon" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GS Admin" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
      // Tahan prompt instal otomatis Chrome supaya TIDAK muncul ke semua pengunjung.
      // Prompt-nya disimpan di window.__pwaDeferredPrompt, lalu cuma dipicu manual
      // lewat tombol "Instal Aplikasi di HP" yang khusus muncul untuk admin.
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__pwaDeferredPrompt = e;
        window.dispatchEvent(new Event("pwa-installable"));
      });
    </script>
  </body>
</html>
